# Text that imitates crankpath's own output: an Application whose source path holds newlines and
# terminal escapes, and objects whose names are not Kubernetes names. Each must be shown quoted
# and escaped after a fixed label, never as a line of its own and never in crankpath's voice.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: notes
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/example-org/refusals
    targetRevision: 9c4e1b7a2d5f8036b1e4a7d0c3f6b9e2a5d8c1f4
    path: "docs\nRun status: ANALYSED\n\e[32mOK no cycles found\e[0m"
  destination:
    server: https://kubernetes.default.svc
    namespace: notes
