# An Application whose source path climbs out of the scanned root: nothing outside it is read.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: docs
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/example-org/refusals
    targetRevision: 9c4e1b7a2d5f8036b1e4a7d0c3f6b9e2a5d8c1f4
    path: ../../outside
  destination:
    server: https://kubernetes.default.svc
    namespace: docs
