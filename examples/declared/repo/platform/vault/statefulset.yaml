# Vault reads its TLS certificate through a CSI volume, so no field of this object names the
# Secret: the dependency is invisible to a reader of the files and is declared in crankpath.yaml.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vault
  namespace: vault
spec:
  serviceName: vault
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vault
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vault
    spec:
      containers:
        - name: vault
          image: example.org/images/vault:1.0
          ports:
            - containerPort: 8200
          volumeMounts:
            - name: tls
              mountPath: /vault/tls
      volumes:
        - name: tls
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
