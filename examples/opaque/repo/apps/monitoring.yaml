# Deploys platform/monitoring as plain manifests: the Flux HelmRepository, the HelmRelease and the
# encrypted Secret its values come from.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/example-org/opaque
    targetRevision: 9c4e1b7a2d5f8036b1e4a7d0c3f6b9e2a5d8c1f4
    path: platform/monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
