# A mirror of this same repository on the in-cluster Gitea: no mapping says it is the same
# repository, so crankpath does not read it (it suggests the mapping, and never applies it).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mirror
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://gitea-http.gitea:3000/ops/opaque
    targetRevision: 9c4e1b7a2d5f8036b1e4a7d0c3f6b9e2a5d8c1f4
    path: platform/web
  destination:
    server: https://kubernetes.default.svc
    namespace: mirror
