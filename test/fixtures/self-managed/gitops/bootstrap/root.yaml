# The root Application: renders system/, which installs Argo CD itself and the Gitea Application.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://gitea-http.gitea:3000/ops/self-managed
    targetRevision: main
    path: system
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
