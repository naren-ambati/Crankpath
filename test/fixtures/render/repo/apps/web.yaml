apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: web
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://example.org/ops/render-demo
    path: charts/web
    targetRevision: main
    helm:
      valueFiles:
        - ../../values/web.yaml
      values: |
        replicas: 2
  destination:
    server: https://kubernetes.default.svc
    namespace: web
