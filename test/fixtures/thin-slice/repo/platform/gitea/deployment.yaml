apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea
  namespace: gitea
  labels:
    app.kubernetes.io/instance: gitea
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: gitea
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: gitea
        app.kubernetes.io/name: gitea
    spec:
      initContainers:
        - name: init-config
          image: example.org/images/gitea:1.0
          envFrom:
            - configMapRef:
                name: gitea-config
      containers:
        - name: gitea
          image: example.org/images/gitea:1.0
          env:
            - name: GITEA_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gitea-admin
                  key: password
          ports:
            - containerPort: 3000
