# A stand-in for the controllers this directory installs next to the root ApplicationSet.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-repo-server
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: argocd-repo-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argocd-repo-server
    spec:
      containers:
        - name: repo-server
          image: registry.example.org/gitops/repo-server:1.0.0
