apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: gitea
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: gitea
    spec:
      containers:
        - name: forge
          image: registry.example.org/forge/server:1.0.0
          ports:
            - containerPort: 3000
