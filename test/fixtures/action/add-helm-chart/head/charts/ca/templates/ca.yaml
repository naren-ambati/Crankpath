apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ .Release.Name }}
spec:
  ca:
    secretName: {{ .Release.Name }}-key
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Release.Name }}
spec:
  isCA: true
  commonName: {{ .Release.Name }}
  secretName: {{ .Release.Name }}-key
  issuerRef:
    name: {{ .Release.Name }}
    kind: Issuer
