apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: web
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: web
    spec:
      containers:
        - name: web
          image: example.org/images/web:1.0
          envFrom:
            - configMapRef:
                name: web-config
