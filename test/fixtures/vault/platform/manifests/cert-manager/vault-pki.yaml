# A ClusterIssuer that signs through Vault's PKI engine, reached at Vault's own Service. Vault's
# TLS certificate comes from it: cycle B.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: vault-pki
spec:
  vault:
    server: https://vault.vault.svc:8200
    path: pki_int/sign/vault
    caBundle: Q0EgYnVuZGxlIHBsYWNlaG9sZGVy
    auth:
      kubernetes:
        role: cert-manager
        mountPath: /v1/auth/kubernetes
        serviceAccountRef:
          name: vault-issuer
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-issuer
  namespace: cert-manager
