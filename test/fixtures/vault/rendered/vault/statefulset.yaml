# Hand-written in the shape the Vault chart renders (not chart output): the server StatefulSet
# mounting the configuration ConfigMap (and, for release vault, the vault-tls Secret).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vault
  namespace: vault
spec:
  serviceName: vault-internal
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vault
      app.kubernetes.io/instance: vault
      component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vault
        app.kubernetes.io/instance: vault
        component: server
    spec:
      serviceAccountName: vault
      volumes:
        - name: config
          configMap:
            name: vault-config
        - name: userconfig-vault-tls
          secret:
            secretName: vault-tls
            defaultMode: 420
      containers:
        - name: vault
          image: hashicorp/vault:1.21.0
          args:
            - vault server -config=/vault/config/extraconfig-from-values.hcl
          volumeMounts:
            - name: config
              mountPath: /vault/config
            - name: data
              mountPath: /vault/data
            - name: userconfig-vault-tls
              mountPath: /vault/userconfig/vault-tls
              readOnly: true
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
