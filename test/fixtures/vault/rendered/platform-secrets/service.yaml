# Hand-written in the shape the Vault chart renders (not chart output).
apiVersion: v1
kind: Service
metadata:
  name: platform-secrets-vault
  namespace: platform-secrets
spec:
  selector:
    app.kubernetes.io/name: vault
    app.kubernetes.io/instance: platform-secrets
    component: server
  ports:
    - name: http
      port: 8200
      targetPort: 8200
---
apiVersion: v1
kind: Service
metadata:
  name: platform-secrets-vault-internal
  namespace: platform-secrets
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: vault
    app.kubernetes.io/instance: platform-secrets
    component: server
  ports:
    - name: http
      port: 8200
      targetPort: 8200
