# The External Secrets Operator from its public chart, with values from the platform repository.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/external-secrets/external-secrets
      targetRevision: helm-chart-2.9.0
      path: deploy/charts/external-secrets
      helm:
        releaseName: external-secrets
        valueFiles:
          - $values/values/external-secrets.yaml
    - repoURL: git@github.com:acme/platform.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated: {}
