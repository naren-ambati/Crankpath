# The store every ExternalSecret of the estate reads: the platform-secrets Vault. It authenticates
# with the operator's own service account token (Vault's Kubernetes auth method).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: platform-secrets
spec:
  provider:
    vault:
      server: http://platform-secrets-vault.platform-secrets.svc:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
