# A second Vault release, `platform-secrets`, that holds the platform repository's deploy key. It
# is configured from this public repository only, so it does not need the platform credential.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-secrets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/hashicorp/vault-helm
    targetRevision: v0.34.1
    path: .
    helm:
      releaseName: platform-secrets
      valuesObject:
        injector:
          enabled: false
        server:
          serviceAccount:
            annotations:
              eks.amazonaws.com/role-arn: arn:aws:iam::111122223333:role/platform-secrets-unseal
          standalone:
            enabled: true
            config: |
              ui = true
              listener "tcp" {
                address     = "[::]:8200"
                tls_disable = 1
              }
              storage "file" {
                path = "/vault/data"
              }
              seal "awskms" {
                region     = "us-east-1"
                kms_key_id = "alias/platform-secrets-unseal"
              }
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-secrets
  syncPolicy:
    automated: {}
