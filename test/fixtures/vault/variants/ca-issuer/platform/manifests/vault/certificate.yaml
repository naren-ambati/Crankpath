# Vault's own TLS certificate, issued by the bootstrap CA instead of Vault's PKI engine.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vault-tls
  namespace: vault
spec:
  secretName: vault-tls
  commonName: vault.vault.svc
  dnsNames:
    - vault
    - vault.vault
    - vault.vault.svc
    - vault.vault.svc.cluster.local
    - vault-internal.vault.svc
  issuerRef:
    name: bootstrap-ca
    kind: ClusterIssuer
    group: cert-manager.io
