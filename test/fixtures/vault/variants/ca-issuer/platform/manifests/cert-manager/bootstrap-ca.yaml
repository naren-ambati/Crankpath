# A `ca` ClusterIssuer whose CA key pair is seeded at bootstrap from the platform-secrets Vault.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: bootstrap-ca
spec:
  ca:
    secretName: bootstrap-ca
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bootstrap-ca
  namespace: cert-manager
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-secrets
  target:
    name: bootstrap-ca
    template:
      type: kubernetes.io/tls
  data:
    - secretKey: tls.crt
      remoteRef:
        key: pki/bootstrap-ca
        property: certificate
    - secretKey: tls.key
      remoteRef:
        key: pki/bootstrap-ca
        property: private_key
